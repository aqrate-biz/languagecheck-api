openapi: 3.0.3
info:
  title: LanguageCheck API
  description: >
    These are the APIs for LanguageCheck (languagecheck.ai), enabling direct
    access to its services through RESTful calls.
  version: "2.1.1"
  termsOfService: https://languagecheck.ai/terms-of-use
  contact:
    name: LanguageCheck crew
    url: https://languagecheck.ai
    email: crew@languagecheck.ai
security:
  - ApiKeyAuth: []
servers:
  - url: https://api.languagecheck.ai/v2
paths:
  /status:
    get:
      operationId: getStatus
      summary: Get service status
      description: Returns the current status of the service and the health of its
        components.
      tags:
        - Status
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Service operational
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                response:
                  value:
                    success: true
                    status: 200
                    message: Service operational
                    metadata:
                      timestamp: 2024-05-09T12:00:00Z
                      requestId: a3f92c1d-8e74-4b2a-bc01-f3d9e5a71c88
                      version: 2.0.1
                    data:
                      status: ok
                      version: 2.0.0
                      timestamp: 2024-05-09T12:00:00Z
                    errors: null
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /check:
    post:
      operationId: postCheck
      summary: Check bilingual segment for translation issues
      description: Analyze the provided text and return detected issues and suggestions.
      tags:
        - Check
      security:
        - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - source
                - target
                - sourceLanguage
                - targetLanguage
              properties:
                source:
                  type: string
                  description: Source text to be checked
                  example: This is an example sentence with a error.
                target:
                  type: string
                  description: Target text to be checked
                  example: Questo è un esempio di frase con un errore.
                sourceLanguage:
                  allOf:
                    - $ref: "#/components/schemas/Language"
                  description: Language of the source text
                  example: en-US
                targetLanguage:
                  allOf:
                    - $ref: "#/components/schemas/Language"
                  description: Language of the target text
                  example: it-IT
                responseLanguage:
                  allOf:
                    - $ref: "#/components/schemas/Language"
                  description: Language of the response
                  example: en-US
                  default: en-US
        description: Input data for check
        required: true
      responses:
        "201":
          description: Check completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResponse"
        "400":
          description: Bad request (e.g., missing or invalid 'text' field)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "402":
          $ref: "#/components/responses/WordsQuotaExceededError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "408":
          $ref: "#/components/responses/RequestTimeoutError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /multisegment-check:
    post:
      operationId: postMultisegmentCheck
      summary: Check multiple bilingual segments for translation issues
      description: Analyze up to 10 bilingual segments independently and return one
        result per segment, in input order.
      tags:
        - Check
      security:
        - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - sourceLanguage
                - targetLanguage
                - segments
              example:
                sourceLanguage: en-US
                targetLanguage: it-IT
                responseLanguage: en-US
                segments:
                  - id: segment-1
                    source: Hello world.
                    target: Ciao mondo.
                  - id: segment-2
                    source: Good morning.
                    target: Buongiorno.
              properties:
                sourceLanguage:
                  allOf:
                    - $ref: "#/components/schemas/Language"
                  description: Language of the source texts
                  example: en-US
                targetLanguage:
                  allOf:
                    - $ref: "#/components/schemas/Language"
                  description: Language of the target texts
                  example: it-IT
                responseLanguage:
                  allOf:
                    - $ref: "#/components/schemas/Language"
                  description: Language of the responses
                  example: en-US
                  default: en-US
                model:
                  type: string
                  description: Optional language check model
                segments:
                  type: array
                  description: Bilingual segments to check; IDs must be unique within the request
                  minItems: 1
                  maxItems: 10
                  items:
                    $ref: "#/components/schemas/MultiSegmentCheckInput"
        description: Shared languages and segments to check
        required: true
      responses:
        "200":
          description: Segment checks completed, including any per-segment errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiSegmentCheckResponse"
              examples:
                response:
                  value:
                    success: true
                    status: 200
                    message: OK
                    metadata:
                      timestamp: 2026-09-01T09:00:00Z
                      requestId: a3f92c1d-8e74-4b2a-bc01-f3d9e5a71c88
                      version: v2
                      requestReceivedAt: 2026-09-01T08:59:59Z
                      processingTimeMs: 1234
                    data:
                      results:
                        - id: segment-1
                          success: true
                          result:
                            evaluation: FLAWLESS
                            isAmbiguous: false
                            minorErrors: false
                            majorErrors: false
                            fluencyIssues: false
                            minorErrorsExplanation: ""
                            majorErrorsExplanation: ""
                            fluencyIssuesExplanation: ""
                            words: 2
                          error: null
                        - id: segment-2
                          success: true
                          result:
                            evaluation: FLAWLESS
                            isAmbiguous: false
                            minorErrors: false
                            majorErrors: false
                            fluencyIssues: false
                            minorErrorsExplanation: ""
                            majorErrorsExplanation: ""
                            fluencyIssuesExplanation: ""
                            words: 2
                          error: null
                    error: null
        "400":
          description: Invalid shared fields or request structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "402":
          $ref: "#/components/responses/WordsQuotaExceededError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "408":
          $ref: "#/components/responses/RequestTimeoutError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /wallet:
    get:
      operationId: getWallet
      summary: Get wallet information
      description: Returns the current status of the user's wallet, including balance
        and transaction history.
      tags:
        - Wallet
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Wallet information retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
components:
  responses:
    UnauthorizedError:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    WordsQuotaExceededError:
      description: Words quota exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    MethodNotAllowedError:
      description: HTTP method not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    RequestTimeoutError:
      description: Request timed out
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    TooManyRequestsError:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    ServiceUnavailableError:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    ApiResponse:
      type: object
      required:
        - success
        - status
        - message
        - metadata
      properties:
        success:
          type: boolean
          description: Outcome of the request
          example: true
        status:
          type: integer
          description: HTTP status code of the response
          example: 200
        message:
          type: string
          description: Descriptive message for the outcome
          example: Operation completed successfully
        metadata:
          $ref: "#/components/schemas/ResponseMetadata"
        errors:
          type: array
          nullable: true
          description: List of errors (null on success)
          items:
            $ref: "#/components/schemas/ApiError"
          example: null
    ResponseMetadata:
      type: object
      required:
        - timestamp
        - requestId
        - version
        - requestReceivedAt
        - processingTimeMs
        - user
        - apiKey
      properties:
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp of the response
          example: 2024-05-09T12:00:00Z
        requestId:
          type: string
          description: Unique request ID (useful for debugging)
          example: a3f92c1d-8e74-4b2a-bc01-f3d9e5a71c88
        version:
          type: string
          description: API version
          example: v2
        requestReceivedAt:
          type: string
          format: date-time
          description: UTC timestamp when the request was received
          example: 2024-05-09T12:00:00Z
        processingTimeMs:
          type: integer
          description: Time taken to process the request in milliseconds
          example: 123
        user:
          type: string
          description: User identifier (e.g., email) associated with the request (if
            available)
          example: user@example.com
        apiKey:
          type: string
          description: API key used for the request (if available)
          example: api_key_123
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error identifier code
          example: VALIDATION_ERROR
        field:
          type: string
          description: Field involved (optional, for validation errors)
          example: email
        message:
          type: string
          description: Human-readable error description
          example: The email format is not valid
    Status:
      type: object
      required:
        - system
        - ai
      properties:
        system:
          type: string
          enum:
            - operational
            - degraded_performance
            - partial_outage
            - major_outage
            - under_maintenance
          description: Operational status of the system
          example: operational
        ai:
          type: string
          enum:
            - operational
            - degraded_performance
            - partial_outage
            - major_outage
            - under_maintenance
          description: Operational status of the AI service
          example: operational
    CheckResult:
      type: object
      required:
        - evaluation
        - isAmbiguous
        - minorErrors
        - majorErrors
        - fluencyIssues
        - minorErrorsExplanation
        - majorErrorsExplanation
        - fluencyIssuesExplanation
        - words
      properties:
        evaluation:
          type: string
          description: Evaluation result
          example: pass
        isAmbiguous:
          type: boolean
          description: Indicates if the result is ambiguous
          example: false
        minorErrors:
          type: boolean
          description: Indicates if there are minor errors
          example: true
        majorErrors:
          type: boolean
          description: Indicates if there are major errors
          example: false
        fluencyIssues:
          type: boolean
          description: Indicates if there are fluency issues
          example: true
        minorErrorsExplanation:
          type: string
          description: Explanation of minor errors
          example: Minor spelling mistakes
        majorErrorsExplanation:
          type: string
          description: Explanation of major errors
          example: ""
        fluencyIssuesExplanation:
          type: string
          description: Explanation of fluency issues
          example: Some sentences are awkwardly phrased
        words:
          type: integer
          description: Number of words in the source text
          example: 10
    MultiSegmentCheckInput:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Unique segment identifier within the request
          example: segment-1
        source:
          type: string
          description: Source text to be checked
          example: Hello world.
        target:
          type: string
          description: Target text to be checked
          example: Ciao mondo.
    MultiSegmentCheckError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP-compatible error code for the segment
          example: 400
        message:
          type: string
          description: Human-readable error description
          example: Validation error
        details:
          type: array
          description: Additional error details, such as validation fields and messages
          items:
            type: object
    MultiSegmentCheckItemResult:
      type: object
      required:
        - id
        - success
      properties:
        id:
          type: string
          description: Segment identifier supplied in the request
          example: segment-1
        success:
          type: boolean
          description: Whether the segment check completed successfully
          example: true
        result:
          $ref: "#/components/schemas/CheckResult"
        error:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MultiSegmentCheckError"
    MultiSegmentCheckResult:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          description: Results in the same order as the input segments
          items:
            $ref: "#/components/schemas/MultiSegmentCheckItemResult"
    WalletInfo:
      type: object
      required:
        - words
        - lastUpdated
      properties:
        words:
          type: integer
          description: Number of words remaining in the user's wallet
          example: 1500
        lastUpdated:
          type: string
          format: date-time
          description: UTC timestamp of the last wallet update
          example: 2024-05-09T12:00:00Z
    StatusResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Status"
    CheckResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CheckResult"
    MultiSegmentCheckResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MultiSegmentCheckResult"
    WalletResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WalletInfo"
    ErrorApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: string
              nullable: true
              description: Always null in case of error
              example: null
