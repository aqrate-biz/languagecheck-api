openapi: 3.0.3
info:
  title: LanguageCheck API
  description: >
    These are the APIs for LanguageCheck (languagecheck.ai), enabling direct
    access to its services through RESTful calls.
  version: "2.1.1"
  termsOfService: https://languagecheck.ai/terms-of-use
  contact:
    name: LanguageCheck crew
    url: https://languagecheck.ai
    email: crew@languagecheck.ai
security:
  - ApiKeyAuth: []
servers:
  - url: https://api.languagecheck.ai/v2
paths:
  /status:
    get:
      operationId: getStatus
      summary: Get service status
      description: Returns the current status of the service and the health of its
        components.
      tags:
        - Status
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Service operational
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                response:
                  value:
                    success: true
                    status: 200
                    message: Service operational
                    metadata:
                      timestamp: 2024-05-09T12:00:00Z
                      requestId: a3f92c1d-8e74-4b2a-bc01-f3d9e5a71c88
                      version: 2.0.1
                    data:
                      status: ok
                      version: 2.0.0
                      timestamp: 2024-05-09T12:00:00Z
                    errors: null
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /check:
    post:
      operationId: postCheck
      summary: Check bilingual segment for translation issues
      description: Analyze the provided text and return detected issues and suggestions.
      tags:
        - Check
      security:
        - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - source
                - target
                - sourceLanguage
                - targetLanguage
              properties:
                source:
                  type: string
                  description: Source text to be checked
                  example: This is an example sentence with a error.
                target:
                  type: string
                  description: Target text to be checked
                  example: Questo è un esempio di frase con un errore.
                sourceLanguage:
                  allOf:
                    - $ref: "#/components/schemas/Language"
                  description: Language of the source text
                  example: en-US
                targetLanguage:
                  allOf:
                    - $ref: "#/components/schemas/Language"
                  description: Language of the target text
                  example: it-IT
                responseLanguage:
                  allOf:
                    - $ref: "#/components/schemas/Language"
                  description: Language of the response
                  example: en-US
                  default: en-US
        description: Input data for check
        required: true
      responses:
        "201":
          description: Check completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResponse"
        "400":
          description: Bad request (e.g., missing or invalid 'text' field)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "402":
          $ref: "#/components/responses/WordsQuotaExceededError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "408":
          $ref: "#/components/responses/RequestTimeoutError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /multisegment-check:
    post:
      operationId: postMultisegmentCheck
      summary: Check multiple bilingual segments for translation issues
      description: Analyze up to 10 bilingual segments independently and return one
        result per segment, in input order.
      tags:
        - Check
      security:
        - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - sourceLanguage
                - targetLanguage
                - segments
              example:
                sourceLanguage: en-US
                targetLanguage: it-IT
                responseLanguage: en-US
                segments:
                  - id: segment-1
                    source: Hello world.
                    target: Ciao mondo.
                  - id: segment-2
                    source: Good morning.
                    target: Buongiorno.
              properties:
                sourceLanguage:
                  allOf:
                    - $ref: "#/components/schemas/Language"
                  description: Language of the source texts
                  example: en-US
                targetLanguage:
                  allOf:
                    - $ref: "#/components/schemas/Language"
                  description: Language of the target texts
                  example: it-IT
                responseLanguage:
                  allOf:
                    - $ref: "#/components/schemas/Language"
                  description: Language of the responses
                  example: en-US
                  default: en-US
                model:
                  type: string
                  description: Optional language check model
                segments:
                  type: array
                  description: Bilingual segments to check; IDs must be unique within the request
                  minItems: 1
                  maxItems: 10
                  items:
                    $ref: "#/components/schemas/MultiSegmentCheckInput"
        description: Shared languages and segments to check
        required: true
      responses:
        "200":
          description: Segment checks completed, including any per-segment errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiSegmentCheckResponse"
              examples:
                response:
                  value:
                    success: true
                    status: 200
                    message: OK
                    metadata:
                      timestamp: 2026-09-01T09:00:00Z
                      requestId: a3f92c1d-8e74-4b2a-bc01-f3d9e5a71c88
                      version: v2
                      requestReceivedAt: 2026-09-01T08:59:59Z
                      processingTimeMs: 1234
                    data:
                      results:
                        - id: segment-1
                          success: true
                          result:
                            evaluation: FLAWLESS
                            isAmbiguous: false
                            minorErrors: false
                            majorErrors: false
                            fluencyIssues: false
                            minorErrorsExplanation: ""
                            majorErrorsExplanation: ""
                            fluencyIssuesExplanation: ""
                            words: 2
                          error: null
                        - id: segment-2
                          success: true
                          result:
                            evaluation: FLAWLESS
                            isAmbiguous: false
                            minorErrors: false
                            majorErrors: false
                            fluencyIssues: false
                            minorErrorsExplanation: ""
                            majorErrorsExplanation: ""
                            fluencyIssuesExplanation: ""
                            words: 2
                          error: null
                    error: null
        "400":
          description: Invalid shared fields or request structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "402":
          $ref: "#/components/responses/WordsQuotaExceededError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "408":
          $ref: "#/components/responses/RequestTimeoutError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /file-check:
    post:
      operationId: postFileCheck
      summary: Start a language check from an uploaded file
      description: |
        Creates a language check from a bilingual file and returns its process id.

        Call this operation with either content type:

        - `application/json`: the body is `FileCheckOptions`. For a new check,
          `fileUrl` is required; the server downloads that HTTP(S) URL (max 100 MiB).
        - `multipart/form-data`: the body is `FileCheckMultipartRequest`, with a
          `file` part and a `json` part (`Content-Type: application/json`) whose
          schema is `FileCheckOptions`. `fileUrl` is not required when `file` is sent.

        Allowed file types: mqxliff, xlf, txlf, xliff, mxliff, sdlxliff, mqxlz, or
        zip. A zip is expanded server-side; only entries with those extensions are
        attached (nested zip skipped). Zip archive max 30 MiB; each entry max 100 MiB.

        When both `action` and `processId` are set, the call behaves like
        `PUT /file-check/{processId}` and neither `file` nor `fileUrl` is required.
      tags:
        - Check
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        description: |
          Use `application/json` or `multipart/form-data`. The schema depends on
          the content type.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileCheckOptions"
            example:
              checkName: My API file check
              fileUrl: https://example.com/files/sample.xliff
              onlyImport: false
              responseLanguage: en-US
              webhookUrl: https://example.com/hooks/languagecheck
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileCheckMultipartRequest"
            encoding:
              file:
                contentType: application/octet-stream
              json:
                contentType: application/json
      responses:
        "201":
          description: File check accepted and process created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileCheckResponse"
        "400":
          description: Validation error (missing file, fileUrl, or json, or invalid options)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "405":
          $ref: "#/components/responses/MethodNotAllowedError"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /file-check/{processId}:
    get:
      operationId: getFileCheck
      summary: Get language-check process progress
      description: |
        Flat progress snapshot for the language check identified by `processId`
        (`status`, `timestamp`, `processed`, `entries`, `words`). Progress counts
        may be null until check data exists; `words` sums imported file word counts.
      tags:
        - Check
      security:
        - ApiKeyAuth: []
      parameters:
        - name: processId
          in: path
          required: true
          description: Id of the process (for example from POST /file-check)
          schema:
            type: string
            example: eu_abc123
      responses:
        "200":
          description: Process progress snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileCheckStatusResponse"
        "400":
          description: Missing processId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Process not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
    put:
      operationId: putFileCheck
      summary: Perform an action on a file-check process
      description: |
        Body `action` selects the operation. Currently only `START`: starts the
        language check for an API process in `DRAFT` after draft import (typical
        after `POST /file-check` with `onlyImport: true`).
      tags:
        - Check
      security:
        - ApiKeyAuth: []
      parameters:
        - name: processId
          in: path
          required: true
          description: Id of the process (for example from POST /file-check)
          schema:
            type: string
            example: eu_abc123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileCheckPutBody"
      responses:
        "200":
          description: Action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileCheckResponse"
        "400":
          description: Missing or invalid action, invalid status, or process already started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Process not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
    delete:
      operationId: deleteFileCheck
      summary: Delete a language-check process
      description: |
        Deletes the process identified by `processId`. Only processes created via
        `POST /file-check` are accepted.
      tags:
        - Check
      security:
        - ApiKeyAuth: []
      parameters:
        - name: processId
          in: path
          required: true
          description: Id of the process (for example from POST /file-check)
          schema:
            type: string
            example: eu_abc123
      responses:
        "200":
          description: Delete accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileCheckResponse"
        "400":
          description: Missing processId or process not created via the API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Process not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorApiResponse"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /wallet:
    get:
      operationId: getWallet
      summary: Get wallet information
      description: Returns the current status of the user's wallet, including balance
        and transaction history.
      tags:
        - Wallet
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Wallet information retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
components:
  responses:
    UnauthorizedError:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    WordsQuotaExceededError:
      description: Words quota exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    MethodNotAllowedError:
      description: HTTP method not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    RequestTimeoutError:
      description: Request timed out
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    TooManyRequestsError:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
    ServiceUnavailableError:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorApiResponse"
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    ApiResponse:
      type: object
      required:
        - success
        - status
        - message
        - metadata
      properties:
        success:
          type: boolean
          description: Outcome of the request
          example: true
        status:
          type: integer
          description: HTTP status code of the response
          example: 200
        message:
          type: string
          description: Descriptive message for the outcome
          example: Operation completed successfully
        metadata:
          $ref: "#/components/schemas/ResponseMetadata"
        errors:
          type: array
          nullable: true
          description: List of errors (null on success)
          items:
            $ref: "#/components/schemas/ApiError"
          example: null
    ResponseMetadata:
      type: object
      required:
        - timestamp
        - requestId
        - version
        - requestReceivedAt
        - processingTimeMs
        - user
        - apiKey
      properties:
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp of the response
          example: 2024-05-09T12:00:00Z
        requestId:
          type: string
          description: Unique request ID (useful for debugging)
          example: a3f92c1d-8e74-4b2a-bc01-f3d9e5a71c88
        version:
          type: string
          description: API version
          example: v2
        requestReceivedAt:
          type: string
          format: date-time
          description: UTC timestamp when the request was received
          example: 2024-05-09T12:00:00Z
        processingTimeMs:
          type: integer
          description: Time taken to process the request in milliseconds
          example: 123
        user:
          type: string
          description: User identifier (e.g., email) associated with the request (if
            available)
          example: user@example.com
        apiKey:
          type: string
          description: API key used for the request (if available)
          example: api_key_123
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error identifier code
          example: VALIDATION_ERROR
        field:
          type: string
          description: Field involved (optional, for validation errors)
          example: email
        message:
          type: string
          description: Human-readable error description
          example: The email format is not valid
    Status:
      type: object
      required:
        - system
        - ai
      properties:
        system:
          type: string
          enum:
            - operational
            - degraded_performance
            - partial_outage
            - major_outage
            - under_maintenance
          description: Operational status of the system
          example: operational
        ai:
          type: string
          enum:
            - operational
            - degraded_performance
            - partial_outage
            - major_outage
            - under_maintenance
          description: Operational status of the AI service
          example: operational
    CheckResult:
      type: object
      required:
        - evaluation
        - isAmbiguous
        - minorErrors
        - majorErrors
        - fluencyIssues
        - minorErrorsExplanation
        - majorErrorsExplanation
        - fluencyIssuesExplanation
        - words
      properties:
        evaluation:
          type: string
          description: Evaluation result
          example: pass
        isAmbiguous:
          type: boolean
          description: Indicates if the result is ambiguous
          example: false
        minorErrors:
          type: boolean
          description: Indicates if there are minor errors
          example: true
        majorErrors:
          type: boolean
          description: Indicates if there are major errors
          example: false
        fluencyIssues:
          type: boolean
          description: Indicates if there are fluency issues
          example: true
        minorErrorsExplanation:
          type: string
          description: Explanation of minor errors
          example: Minor spelling mistakes
        majorErrorsExplanation:
          type: string
          description: Explanation of major errors
          example: ""
        fluencyIssuesExplanation:
          type: string
          description: Explanation of fluency issues
          example: Some sentences are awkwardly phrased
        words:
          type: integer
          description: Number of words in the source text
          example: 10
    MultiSegmentCheckInput:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Unique segment identifier within the request
          example: segment-1
        source:
          type: string
          description: Source text to be checked
          example: Hello world.
        target:
          type: string
          description: Target text to be checked
          example: Ciao mondo.
    MultiSegmentCheckError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP-compatible error code for the segment
          example: 400
        message:
          type: string
          description: Human-readable error description
          example: Validation error
        details:
          type: array
          description: Additional error details, such as validation fields and messages
          items:
            type: object
    MultiSegmentCheckItemResult:
      type: object
      required:
        - id
        - success
      properties:
        id:
          type: string
          description: Segment identifier supplied in the request
          example: segment-1
        success:
          type: boolean
          description: Whether the segment check completed successfully
          example: true
        result:
          $ref: "#/components/schemas/CheckResult"
        error:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MultiSegmentCheckError"
    MultiSegmentCheckResult:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          description: Results in the same order as the input segments
          items:
            $ref: "#/components/schemas/MultiSegmentCheckItemResult"
    WalletInfo:
      type: object
      required:
        - words
        - lastUpdated
      properties:
        words:
          type: integer
          description: Number of words remaining in the user's wallet
          example: 1500
        lastUpdated:
          type: string
          format: date-time
          description: UTC timestamp of the last wallet update
          example: 2024-05-09T12:00:00Z
    StatusResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Status"
    CheckResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CheckResult"
    MultiSegmentCheckResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MultiSegmentCheckResult"
    WalletResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WalletInfo"
    FileCheckOptions:
      type: object
      description: |
        Options for `POST /file-check` when `Content-Type` is `application/json`.
        For a new check, `fileUrl` is required. When both `action` and `processId`
        are set, the call delegates to `PUT /file-check/{processId}` and `fileUrl`
        is not required. The same object is the `json` part of a multipart request;
        there, `fileUrl` is optional if the `file` part is present.
      properties:
        checkName:
          type: string
          description: Optional display name for the created language check process
          example: My API file check
        fileUrl:
          type: string
          format: uri
          description: |
            HTTP(S) URL the server downloads (max 100 MiB). Required for
            `application/json` when creating a new check. Omit it for
            `multipart/form-data` when the `file` part is sent, and when both
            `action` and `processId` are set.
          example: https://example.com/files/sample.xliff
        onlyImport:
          type: boolean
          default: false
          description: |
            If true, only draft import runs; the webhook (if set) fires after
            import with `success`, `processId`, `words`, and `error`. If false
            (default), the language check starts automatically after import.
            Ignored when both `action` and `processId` are set.
          example: false
        action:
          type: string
          enum:
            - START
          description: |
            With `processId`, act on an existing process (same as
            `PUT /file-check/{processId}`). Both `action` and `processId` are
            required together.
          example: START
        processId:
          type: string
          description: |
            With `action`, id of an existing process created via file-check.
          example: eu_abc123
        webhookUrl:
          type: string
          format: uri
          description: |
            Optional HTTP(S) callback. With `onlyImport`, it fires after import.
            Otherwise it fires when the language check ends or on flow errors.
          example: https://example.com/hooks/languagecheck
        webhookOptions:
          type: object
          description: |
            Options for the webhook on the full language-check flow (not
            `onlyImport`). When `attachXliff` is true and the check succeeds,
            the callback is `multipart/form-data`; otherwise it is
            `application/json`.
          properties:
            attachXliff:
              type: boolean
              default: false
              description: Attach annotated XLIFF file(s) to the success webhook as multipart
            reportUrl:
              type: boolean
              default: false
              description: |
                If true, the final success webhook includes `reportUrl`, a signed
                GET URL (valid up to 7 days) of the Excel report.
            xliffUrls:
              type: boolean
              default: false
              description: |
                If true, the final success webhook includes `xliffUrls`, an array
                of signed GET URLs (valid up to 7 days) of the annotated XLIFF file(s).
            stats:
              type: boolean
              default: false
              description: |
                If true, the final success webhook includes `stats` with segment
                and word counts per evaluation band (`flawless`, `needsImprovement`,
                `incorrectMeaning`), each `{ segments, words }`.
            httpMethod:
              type: string
              enum:
                - POST
                - PUT
              default: POST
              description: |
                HTTP method used to call `webhookUrl`. Default `POST`.
            customFields:
              type: object
              additionalProperties: true
              description: |
                Extra JSON object merged into the webhook payload. Reserved keys
                (`success`, `processId`, `error`, `words`, `reportUrl`, `xliffUrls`,
                `stats`) are not overwritten. Nested objects and arrays in a
                multipart webhook are sent as JSON strings.
              example:
                correlationId: job-42
                source: external-system
          example:
            attachXliff: false
            reportUrl: true
            xliffUrls: true
            stats: true
            httpMethod: POST
            customFields:
              correlationId: job-42
        lockedFilter:
          type: string
          enum:
            - all
            - locked
            - unlocked
          default: all
          description: Filter segments by lock status
        percentMin:
          type: integer
          minimum: 0
          default: 0
          description: Minimum match quality percent
        percentMax:
          type: integer
          minimum: 0
          default: 101
          description: Maximum match quality percent
        translationContext:
          type: string
          description: Optional translation or domain context
        generateTranslationContext:
          type: boolean
          default: false
          description: Whether to generate translation context via AI
        responseLanguage:
          allOf:
            - $ref: "#/components/schemas/Language"
          description: Language of model responses (comments and explanations)
          example: en-US
          default: en-US
        targetLengthCheck:
          type: object
          properties:
            mode:
              type: string
              enum:
                - greaterThanSource
                - greaterThanChars
                - greaterThanSourcePercent
            threshold:
              type: integer
              description: Threshold used by the selected mode
        shortSegmentsMaxSourceWords:
          type: integer
          minimum: 1
          description: Enable short-segment handling with this max source word count
    FileCheckMultipartRequest:
      type: object
      description: |
        Body for `POST /file-check` when `Content-Type` is `multipart/form-data`.
        For a new check, send `file` and optionally `json`. To act on an existing
        process, send `json` with both `action` and `processId` and omit `file`.
      properties:
        file:
          type: string
          format: binary
          description: |
            Bilingual file (mqxliff, xlf, txlf, xliff, mxliff, sdlxliff, mqxlz) or
            a zip of those formats. Required for a new check. Omit when `json`
            contains both `action` and `processId`.
        json:
          allOf:
            - $ref: "#/components/schemas/FileCheckOptions"
          description: |
            Check options, sent as a part with Content-Type `application/json`.
            `fileUrl` is optional when `file` is present.
    FileCheckResult:
      type: object
      required:
        - success
        - processId
      properties:
        success:
          type: boolean
          description: Whether the file-check request was accepted and a process created
          example: true
        processId:
          type: string
          description: Id of the created process
          example: eu_abc123
    FileCheckResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/FileCheckResult"
    FileCheckStatusResult:
      type: object
      properties:
        status:
          type: string
          description: Persisted process status
          example: RUNNING
        timestamp:
          type: integer
          format: int64
          nullable: true
          description: Epoch milliseconds of the last progress update
          example: 1730736000000
        processed:
          type: integer
          format: int64
          nullable: true
          description: Number of segments processed so far
          example: 42
        entries:
          type: integer
          format: int64
          nullable: true
          description: Total segments expected for the check
          example: 100
        words:
          type: integer
          format: int64
          nullable: true
          description: Sum of imported file word counts
          example: 12500
    FileCheckStatusResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/FileCheckStatusResult"
    FileCheckPutBody:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - START
          description: |
            Action to perform on the process. Currently only `START` (start the
            language check after draft import).
          example: START
    ErrorApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: string
              nullable: true
              description: Always null in case of error
              example: null
